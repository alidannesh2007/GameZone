
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Tahoma,sans-serif;
        }

        body{
            background:#142344;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:500px;
            background:#1f335d;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,.4);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:25px;
        }

        textarea{
            width:100%;
            height:180px;
            resize:none;
            border:none;
            border-radius:8px;
            padding:15px;
            font-size:16px;
            outline:none;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2f97c4;
            color:white;
            font-size:17px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#257da3;
        }
    </style>
<body>

<div class="box">

    <h2>ثبت نظر برای بازی</h2>

    <form method="POST">
        {% csrf_token %}

        <textarea
            name="comment"
            placeholder="نظر خود را درباره این بازی بنویسید..."
            required
        ></textarea>

        <button type="submit">
            ثبت نظر
        </button>

    </form>

</div>

</body>
