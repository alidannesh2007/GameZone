{% load static %}
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>GameZone</title>
    <link rel="stylesheet" href="{%static '1.css'%}">
    <link rel="stylesheet" href="{%static 'gamelist.css'%}">
    <link rel="stylesheet" href="{%static 'game_info.css'%}">
    <link rel="stylesheet" href="{%static 'form.css'%}">
    <link rel="stylesheet" href="{%static 'log.css'%}">
    <link rel="stylesheet" href="{%static 'profile.css'%}">


</head>

<body>

    <header class="header">
        <h3>GameZone</h3>

        <nav>
            <a href="{% url 'GameZone'%}">home</a>
            <a href="{% url 'Games list'%}">Games</a>
            <a href="{% url 'profile'%}">profile</a>
            {% if user.is_authenticated %}
                <!-- <a href="{% url 'logout'%}">logout</a> -->
                 <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="button"> logout </button>
                </form>
            {% else %}
                <form action="{% url 'register' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="button"> register </button>
                </form>
                <form action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="button"> login </button>
                </form>
                
                <!-- <a href="{% url 'login'%}">login</a> -->
                <!-- <a href="{% url 'register'%}">register</a> -->
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {%if messages%}
            {%for message in messages%}
                <div>
                    <p>
                        {{message}}
                    </p>
                </div>
            {%endfor%}
        {%endif%}
        <!-- اینجا محتوای هر صفحه میاد -->
        {% block content %}{% endblock %}
    </div>
    </main>

    <footer class="footer">
        <p>© 2026 GameZone</p>
    </footer>

</body>
</html>
